name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write  # required for OIDC trusted publisher

jobs:
  tag-and-release:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "Unable to read version from pyproject.toml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          if git tag | grep -q "^v${{ steps.version.outputs.version }}$"; then
            echo "Tag v${{ steps.version.outputs.version }} already exists."
            exit 1
          fi
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Extract changelog entry for release notes
        run: |
          python3 .github/scripts/extract_changelog_entry.py \
            --version "${{ steps.version.outputs.version }}" \
            --file CHANGELOG.md \
            > release_notes.md
          echo "Release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md

  build:
    needs: tag-and-release
    if: needs.tag-and-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release-rehearsal:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: scripts/release_rehearsal.sh --reuse-dist

  publish-test-pypi:
    needs: release-rehearsal
    if: needs.release-rehearsal.result == 'success'
    runs-on: ubuntu-latest
    environment: test-pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-test-pypi:
    needs: publish-test-pypi
    if: needs.publish-test-pypi.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install the published TestPyPI version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          uv venv .venv-test-pypi
          # TestPyPI index propagation can lag the upload by a few minutes
          for attempt in 1 2 3 4 5; do
            if uv pip install --python .venv-test-pypi/bin/python \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "central-mcp-server==$VERSION"; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo "TestPyPI version $VERSION not installable after 5 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed; waiting 60s for TestPyPI index propagation"
            sleep 60
          done
          .venv-test-pypi/bin/python -c "import server"
          PATH="$PWD/.venv-test-pypi/bin:$PATH" command -v central-mcp-server

  publish-pypi:
    needs: verify-test-pypi
    if: needs.verify-test-pypi.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

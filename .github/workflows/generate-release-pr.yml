name: Generate Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow is run from main
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This workflow must be run from the main branch."
            echo "Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Validate requested version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format; got: ${{ inputs.version }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release prerequisites
        run: |
          VERSION="${{ inputs.version }}"
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing entry for version ${VERSION}."
            exit 1
          fi
          CURRENT_VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml)
          if [[ "$CURRENT_VERSION" == "$VERSION" ]]; then
            echo "pyproject.toml is already version ${VERSION}."
            exit 1
          fi

      - name: Create release branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "s/^version = \"[^\"]+\"/version = \"${VERSION}\"/" pyproject.toml
          git checkout -b "$BRANCH"
          git add pyproject.toml
          git commit -m "chore: release v${VERSION}"
          git push origin "$BRANCH"

          if ! gh pr create \
            --title "chore: release v${VERSION}" \
            --body "Mechanical release cut for **v${VERSION}** from **main**. Merge this PR into **main** to publish it." \
            --base main \
            --head "$BRANCH"; then
            echo "NOTICE: GitHub Actions could not create the release PR."
            echo "Create it manually: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            exit 0
          fi
